  <main class="blog-container" id="main-blog-container">
   <!-- Mensaje mientras carga el JSON -->
   <p style="color: #888; text-align: center; width: 100%; grid-column: 1 / -1; padding: 40px 0;">
    Cargando publicaciones...
   </p>
  </main>
  <script>
   document.addEventListener("DOMContentLoaded", () => {
    const blogContainer = document.getElementById("main-blog-container");
    if (!blogContainer) return;

    fetch("/blog/articulos.json")
        .then((response) => {
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            return response.json();
        })
        .then((articulos) => {
            blogContainer.innerHTML = ""; // Limpiar el mensaje de carga

            if (!articulos || articulos.length === 0) {
                blogContainer.innerHTML = `<p style="color: #888; text-align: center; width: 100%;">Próximamente nuevas publicaciones.</p>`;
                return;
            }

            // Renderizar cada artículo con las clases exactas de tu CSS
            articulos.forEach((art, index) => {
                let cardClass = "card-medium";

                if (index === 0) {
                    cardClass = "card-large";
                } else if (index === 1) {
                    cardClass = "card-small";
                }

                const card = document.createElement("a");
                card.href = `/blog/${art.slug}/`;
                card.className = `article-card ${cardClass}`;

                // ✔️ Si es el primer artículo (portada LCP), usamos fetchpriority="high" sin lazy.
                // Del segundo en adelante sí llevan loading="lazy".
                const imgAttributes = index === 0 
                    ? 'fetchpriority="high"' 
                    : 'loading="lazy"';

                card.innerHTML = `
                    <img src="${art.imagen}" class="card-img" alt="${art.alt || art.titulo}" ${imgAttributes}>
                    <div class="card-content">
                        <span class="category-pill">${art.categoria}</span>
                        <h2>${art.titulo}</h2>
                        ${art.descripcion && index === 0 ? `<p>${art.descripcion}</p>` : ''}
                    </div>
                `;

                blogContainer.appendChild(card);
            });
        })
        .catch((err) => {
            console.error("Error al cargar los artículos en la portada:", err);
            blogContainer.innerHTML = `<p style="color: #666; text-align: center; width: 100%;">No se pudieron cargar las publicaciones en este momento.</p>`;
        });
});
  </script>
